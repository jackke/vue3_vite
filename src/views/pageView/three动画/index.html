    var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.x = -30;
        camera.position.y = 40;
        camera.position.z = 60
        camera.lookAt(scene.position);
        // 创建渲染器对像
        var renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        renderer.setClearColor(new THREE.Color(0x000000));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;

        var axes = new THREE.AxesHelper(20);
        scene.add(axes);
        var planeGeometry = new THREE.PlaneGeometry(60, 20, 1, 1);
        var planeMaterial = new THREE.MeshLambertMaterial({
            color: 0xcccccc
        });
        var plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -0.5 * Math.PI;
        plane.position.x = 15
        plane.position.y = 0
        plane.position.z = 0
        scene.add(plane);
        plane.receiveShadow = true;
        var geometry = new THREE.BoxGeometry(4, 4, 4);
        var material = new THREE.MeshLambertMaterial({
            color: 0x00ff00
        });
        var cube = new THREE.Mesh(geometry, material);
        cube.position.x = 0;
        cube.position.y = 2;
        cube.position.z = 0;
        cube.castShadow = true;
        scene.add(cube);
        // 平行光
        const light = new THREE.DirectionalLight('#5fe', 1)
        light.position.set(10, 5, 20)
        light.castShadow = true;
        // const targetObject = new THREE.Object3D();
        // scene.add(targetObject);

        // light.target = targetObject;
        // light.shadow.mapSize.width = 512; // default
        // light.shadow.mapSize.height = 512; // default
        // light.shadow.camera.near = 0.5; // default
        // light.shadow.camera.far = 500 // default
        // 点光源
        var spotLight = new THREE.PointLight(0xffffff);
        spotLight.position.set(50, 50, 50);
        spotLight.shadowCameraNear = 2;
        spotLight.shadowCameraFar = 200;
        spotLight.distance = 0;
        spotLight.angle = 0.4;
        // spotLight.castShadow = true;

        scene.add(spotLight)
        scene.add(light);


        

        // var stats = new Stats();
        // stats.showPanel(0);
        // document.body.appendChild(stats.dom);
        var sphereGeometry = new THREE.SphereGeometry(4, 100, 100)
        var sphereMeterial = new THREE.MeshLambertMaterial({
            color: '#d4237a'
        })
        sphere = new THREE.Mesh(sphereGeometry, sphereMeterial)
        sphere.position.x = 8;
        sphere.position.y = 6;
        sphere.position.z = 2;
        sphere.castShadow = true;
        scene.add(sphere);
        var sphereGeometry2 = new THREE.SphereGeometry(3, 30, 30)
        var sphereMeterial2 = new THREE.MeshLambertMaterial({
            color: '#abf45a'
        })
        sphere2 = new THREE.Mesh(sphereGeometry2, sphereMeterial2)
        sphere2.position.x = 0;
        sphere2.position.y = 1;
        sphere2.position.z = 5;
        sphere2.castShadow = true;
        scene.add(sphere2);
        var step = 0;
        var step2 = 0;
        function animate() {

            // cube.rotation.x += 0.09;
            // cube.rotation.y += 0.04;
            // sphere.position.x = 20 + (10 * Math.cos(step));
            step += 0.02
            step2 += 0.05
            sphere.position.y = 2 + (10 * Math.abs(Math.sin(step)))
            sphere2.position.x = 2 + (10 * Math.cos(step2));
            sphere2.position.z = 2 + (10 * Math.abs(Math.sin(step2)))
            requestAnimationFrame(animate);
            renderer.render(scene, camera);


            renderer.shadowMap.enabled = true;
        }
        animate();
