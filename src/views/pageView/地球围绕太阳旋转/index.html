<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .yuan{
            width: 400px;
            height: 400px;
            border: 1px solid #000;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            margin-top: -200px;
            margin-left: -200px;
            /* transform: translate(-50%, -50%); */
            animation: rotate 10s infinite linear;
        }
        .diqiu{
            border-radius: 50%;
            width: 80px;
            height: 80px;
            background-color: blue;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .taiyang{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 5px 5px 10px red, -5px -5px 10px red, 5px -5px 10px red, -5px 5px 10px red;
            background: red;
        }
        .yueliang{
            border-radius: 50%;
            width: 30px;
            height: 30px;
            background-color: #999;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        @keyframes rotate {
            100%{
                transform: rotate(360deg)
            }
        }
    </style>
</head>
<body>
    <div style="width: 100vw; height: 100vh;">
        <div class="yuan">
                <div class="diqiu"></div>
                <div class="yuan" style="width: 160px;height: 160px;margin: 0; top: 0;margin-left: -80px; margin-top: -80px;animation: rotate 5s infinite linear;">
                    <div class="yueliang"></div>
                </div>
        </div>
        <div class="taiyang">  </div>
    </div>
</body>
</html>
