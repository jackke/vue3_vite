<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        .beijing{
            border: 50px solid #eee;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        /* .qiu-box{
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            animation: rotate 2.8s ease infinite;
            transform-origin: 50% 50%;
        } */
        .qiu{
            width: 50px;
            height: 50px;
            border-radius: 50%;
            position: absolute;
            top: 0%;
            left: 50%;
            margin-left: -50px;
            margin-top: -50px;
            background-color: #845EC2;
            animation: rotate 2.8s ease infinite;
            transform-origin: 100% 250px;
        }
        .qiu:nth-child(1){
            z-index: 10;
        }
        .qiu:nth-child(2){
            width: 48px;
            height: 48px;
            margin-top: -48px;
            background-color: #4B4453;
            animation-delay: 0.2s;
            z-index: 9;
        }
        .qiu:nth-child(3){
            width: 46px;
            height: 46px;
            margin-top: -46px;
            background-color: #B0A8B9;
            animation-delay: 0.4s;
            z-index: 8;
        }
        .qiu:nth-child(4){
            width: 44px;
            height: 44px;
            margin-top: -44px;
            background-color: #B0A8B9;
            animation-delay: 0.6s;
            z-index: 7;
        }
        .qiu:nth-child(5){
            width: 42px;
            height: 42px;
            margin-top: -42px;
            background-color: #00896F;
            animation-delay: 0.8s;
            z-index: 6;
        }
        .qiu:nth-child(6){
            width: 40px;
            height: 40px;
            margin-top: -40px;
            background-color: #00C0A3;
            animation-delay: 1s;
            z-index: 5;
        }
        .qiu:nth-child(7){
            width: 38px;
            height: 38px;
            margin-top: -38px;
            background-color: #008BC8;
            animation-delay: 1.2s;
            z-index: 4;
        }
        @keyframes rotate {
            100%{
                transform: rotate(1turn);
            }
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="beijing">
            <!-- <div class="qiu-box"> -->
                <div class="qiu"></div>
                <div class="qiu"></div>
                <div class="qiu"></div>
                <div class="qiu"></div>
                <div class="qiu"></div>
                <div class="qiu"></div>
                <div class="qiu"></div>
                <div class="qiu"></div>
            <!-- </div>-->
        </div> 
    </div>
</body>
</html>
